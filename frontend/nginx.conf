user nginx;
# Um worker para a comparação inicial, sem multiplicar processos pela CPU do host.
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Não registrar query strings nos access logs.
    log_format servire '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout servire;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 0.0.0.0:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # HTML deve revalidar para não referenciar bundles de um deploy antigo.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        # O Vite gera nomes com hash em /assets. Arquivos ausentes devem ser 404.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~ /\. {
            return 404;
        }

        # Arquivos públicos não versionados não recebem cache imutável.
        location ~* \.(?:js|mjs|css|map|json|webmanifest|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|txt|xml)$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
        }

        # Deep links do BrowserRouter, como /meu-perfil e /eventos/1/escalas.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
